name: publish to s3

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Run Hugo
        run: hugo --minify

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy
        run: |
          # The CSS bundle carries a content hash in its name, so it can be
          # cached forever. It goes first: the second sync then sees it as
          # already current and leaves the header alone. Everything else,
          # images included, keeps a short TTL and revalidates with its ETag,
          # so a replaced file is never stuck in a browser cache.
          aws s3 sync public "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --follow-symlinks \
            --exclude "*" --include "css/*" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync public "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --follow-symlinks \
            --delete \
            --cache-control "public, max-age=300, must-revalidate"

      # Without this the pages sit in S3 while CloudFront serves the old copy
      # until the default TTL expires. Skipped until the variable is set.
      - name: Invalidate CloudFront (optional)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
