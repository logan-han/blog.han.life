{{ if .Site.Params.ShowBreadCrumbs }}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="{{ .Site.Home.RelPermalink }}">Home</a>
  {{ with .Parent }}{{ if not .IsHome }}<span>/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
  <span>/</span><span>{{ .Title }}</span>
</nav>
{{ end }}
