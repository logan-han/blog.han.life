baseURL = "https://blog.han.life/"
title = "Logan's Nest"
languageCode = "en-au"
summarylength = 30
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 20

[params]
env = "production"
title = "Logan's Nest"
description = "Field notes on AWS, Linux, networking and automation from a Melbourne platform engineer."
keywords = ["AWS", "DevOps", "Linux", "Platform engineering", "Melbourne"]
ogLocale = "en_AU"
images = ["images/og-default.png"]
author = "Logan Han"
dateFormat = "2 January, 2006"
defaultTheme = "dark"
disableThemeToggle = true
hideFooter = true
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = true

[params.profileMode]
enabled = true
title = "Logan's Nest"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.socialIcons]]
name = "linkedin"
url = "http://linkedin.com/in/loganhan"

[[params.socialIcons]]
name = "github"
url = "https://github.com/logan-han"

[[params.socialIcons]]
name = "email"
url = "mailto:logan@thisdomain"


[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

[menu]
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "archives"
name = "Archives"
url = "/archives/"
weight = 30

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 40

[taxonomies]
tag = "tags"

# Powers the related-posts block on each post.
[related]
threshold = 60
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "date"
weight = 10

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = true
style = "github-dark"

[services.googleAnalytics]
ID = "G-CVEBFCXFSW"

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true

[imaging]
quality = 85
resampleFilter = "Lanczos"

[outputs]
home = ["HTML", "RSS", "JSON"]
